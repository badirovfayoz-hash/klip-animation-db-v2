name: 🎬 Kichkina Dunyo Generator 24/7

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Nechta animatsiya (default 50)'
        required: false
        default: '50'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🎨 Generatsiya
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
        run: |
          cd generator
          python3 generate.py

      - name: 💾 Saqlash
        run: |
          git config user.name "Kichkina Dunyo Bot"
          git config user.email "bot@kichkina-dunyo.ai"
          git add db/
          if git diff --staged --quiet; then
            echo "Yangilik yo'q"
          else
            COUNT=$(git diff --staged --name-only | grep '\.json$' | wc -l)
            git commit -m "🎬 +${COUNT} animatsiya | $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ ${COUNT} ta saqlandi!"
          fi
